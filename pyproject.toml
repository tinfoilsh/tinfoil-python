[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinfoil"]
sbom-files = ["sbom.cdx.json"]

[project]
name = "tinfoil"
version = "0.15.0"
description = "Python client for Tinfoil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.26.0",
    "httpx>=0.28",
    "tinfoil-ehbp>=0.3.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "pyOpenSSL>=25.0.0",
    "pyasn1>=0.6.5",
    "sigstore>=4.3.0",
    "platformdirs>=4.2.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require TINFOIL_* env vars)",
    "asyncio: mark test perfroming async io"
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["conformance"]

# Lint and type checks cover the code written for the v3 rewrite. The modules
# that the rewrite replaces are excluded until they are removed, so that the
# checks never force churn in code that is on its way out.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "*.md",
    "example.py",
    "src/tinfoil/__init__.py",
    "src/tinfoil/_sdkinfo.py",
    "src/tinfoil/attestation",
    "src/tinfoil/client.py",
    "src/tinfoil/github.py",
    "src/tinfoil/sigstore.py",
    "src/tinfoil/user_cache_secret.py",
    "tests/*.py",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",      # misc
    "PT",       # pytest style
    "RUF",      # ruff's own
    "ASYNC",    # blocking calls in async code
    "S",        # bandit
]
ignore = [
    "S101",     # assert is the test idiom and the contract check idiom
    "S603",     # subprocess without shell, with an argument list, is the intended use
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["conformance"]
files = ["conformance", "tests/conformance"]

[tool.uv]
exclude-newer = "4 days"
constraint-dependencies = [
    "idna>=3.15", # GHSA-65pc-fj4g-8rjx
    "pyjwt>=2.15.0", # GHSA-42vr-xj54-vc7v, GHSA-x33g-cr3x-6449 (via sigstore)
    "dnspython>=2.9.0", # GHSA-45c3-73f7-pv4m (via sigstore -> pydantic[email])
]

[tool.uv.exclude-newer-package]
# tinfoil-ehbp is maintained by tinfoil (first-party dependency)
tinfoil-ehbp = false
# certifi ships CA trust removals (e.g. the eMudhra distrust in 2026.10.19)
certifi = false
