[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinfoil"]
sbom-files = ["sbom.cdx.json"]

[project]
name = "tinfoil"
version = "0.15.0"
description = "Python client for Tinfoil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.26.0",
    "httpx>=0.28",
    "tinfoil-ehbp>=0.5.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "pyOpenSSL>=25.0.0",
    "pyasn1>=0.4.0",
    "sigstore>=4.3.0",
    "platformdirs>=4.2.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "pyyaml>=6.0.3",
    "sigstore-models>=0.0.6",
    "rfc3161-client>=1.0.7",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require TINFOIL_* env vars)",
    "asyncio: mark test perfroming async io"
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["conformance"]
# pytest discards the warning filters that imported modules install, so the
# filter that tinfoil._v3.verifier._x509.certificate sets for the zero serial
# of production AMD VCEK certificates is re-stated for the test run.
filterwarnings = [
    "ignore:^Parsed a serial number which wasn't positive:cryptography.utils.CryptographyDeprecationWarning",
]

# Lint and type checks cover the code written for the v3 rewrite. The modules
# that the rewrite replaces are excluded until they are removed, so that the
# checks never force churn in code that is on its way out.
[tool.ruff]
target-version = "py311"
line-length = 120
src = [".", "src", "conformance"]
extend-exclude = [
    "*.md",
    "example.py",
    "src/tinfoil/__init__.py",
    "src/tinfoil/_sdkinfo.py",
    "src/tinfoil/attestation",
    "src/tinfoil/client.py",
    "src/tinfoil/github.py",
    "src/tinfoil/sigstore.py",
    "src/tinfoil/user_cache_secret.py",
    "tests/test_attestation_all_enclaves.py",
    "tests/test_attestation_flow.py",
    "tests/test_attestation_headers.py",
    "tests/test_certificate_reverification.py",
    "tests/test_collateral_tdx.py",
    "tests/test_constructor_timeout.py",
    "tests/test_ehbp_transport.py",
    "tests/test_encrypted_proxy.py",
    "tests/test_integration_async.py",
    "tests/test_integration_audio.py",
    "tests/test_integration_chat.py",
    "tests/test_integration_http.py",
    "tests/test_pck_extensions.py",
    "tests/test_sev_attestation.py",
    "tests/test_sev_validation.py",
    "tests/test_tdx_abi.py",
    "tests/test_tdx_attestation_flow.py",
    "tests/test_tdx_multiplatform.py",
    "tests/test_tdx_verify.py",
    "tests/test_user_cache_secret.py",
    "tests/test_validate_tdx.py",
    "tests/test_verification_document.py",
    "tests/test_verification_failures.py",
    "tests/test_verification_failures_integration.py",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",      # misc
    "PT",       # pytest style
    "RUF",      # ruff's own
    "ASYNC",    # blocking calls in async code
    "S",        # bandit
]
ignore = [
    "S101",     # assert is the test idiom and the contract check idiom
    "S603",     # subprocess without shell, with an argument list, is the intended use
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S",
    "RUF001", "RUF002", "RUF003",  # tests probe non-ASCII digits and letters on purpose
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["conformance"]
files = ["src/tinfoil/_v3", "conformance", "tests/conformance", "tests/v3", "tests/test_surface.py"]

# The SEV-SNP and TDX library code was moved from the 0.x tree and is typed
# incrementally; its tests follow it. Everything else under _v3 is strict.
[[tool.mypy.overrides]]
module = ["tinfoil._v3.verifier._quote.tdx.lib.*", "tests.v3.lib.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pyasn1.*", "OpenSSL.*"]
ignore_missing_imports = true

[tool.uv]
exclude-newer = "4 days"
constraint-dependencies = [
    "idna>=3.15", # GHSA-65pc-fj4g-8rjx
    "pyjwt>=2.15.0", # GHSA-42vr-xj54-vc7v, GHSA-x33g-cr3x-6449 (via sigstore)
]

[tool.uv.exclude-newer-package]
# tinfoil-ehbp is maintained by tinfoil (first-party dependency)
tinfoil-ehbp = false
# certifi ships CA trust removals (e.g. the eMudhra distrust in 2026.10.19)
certifi = false
